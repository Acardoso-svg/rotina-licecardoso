
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌷 Minha Rotina 💗</title>

  <style>
    :root {
      --pink: #e879ad;
      --dark: #be397d;
      --light: #fff0f7;
      --border: #f5c5dd;
      --text: #543748;
      --muted: #98798a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fff5fa, #fffafd);
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 28px 16px;
      margin-bottom: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 5px 18px #be397d12;
    }

    header h1 {
      margin: 0 0 8px;
      color: var(--dark);
      font-size: clamp(27px, 5vw, 38px);
    }

    header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .day-selector {
      padding: 20px;
      margin-bottom: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 5px 18px #be397d0c;
    }

    .day-selector label {
      display: block;
      margin-bottom: 10px;
      color: var(--dark);
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 13px;
      font: inherit;
      color: var(--text);
      background: #fff7fb;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline-color: var(--pink);
      cursor: pointer;
    }

    .day-card {
      padding: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 5px 18px #be397d0c;
    }

    .day-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 8px;
      border-bottom: 1px solid #f8dfec;
    }

    .day-heading h2 {
      margin: 0;
      color: var(--dark);
      font-size: 22px;
    }

    .today-badge {
      padding: 5px 9px;
      color: var(--dark);
      background: var(--light);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 750;
    }

    .task {
      display: grid;
      grid-template-columns: 19px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 5px;
      border-radius: 9px;
      cursor: pointer;
      line-height: 1.45;
    }

    .task:hover {
      background: #fff5fa;
    }

    .task input {
      width: 17px;
      height: 17px;
      margin: 3px 0 0;
      accent-color: var(--dark);
      cursor: pointer;
    }

    .task-content {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task-time {
      display: block;
      margin-bottom: 2px;
      color: var(--dark);
      font-size: 13px;
      font-weight: 750;
    }

    .task-name {
      display: block;
      font-size: 14px;
    }

    .task input:checked + .task-content .task-name {
      color: #ad98a3;
      text-decoration: line-through;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid #f8dfec;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--light);
      color: var(--dark);
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: #fce0ee;
    }

    .progress {
      margin-top: 16px;
      padding: 12px 14px;
      background: #fff6fb;
      border-radius: 12px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      background: #f6dce9;
      border-radius: 20px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--pink);
      border-radius: 20px;
      transition: width 0.2s ease;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 10px 28px;
      }

      .day-card,
      .day-selector {
        padding: 15px;
      }

      .day-heading h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>🌷 Minha Rotina 💗</h1>
      <p>Uma semana organizada, com tempo para estudar e descansar.</p>
    </header>

    <section class="day-selector">
      <label for="day-select">📅 Escolha o dia da semana</label>
      <select id="day-select">
        <option value="0">Segunda-feira</option>
        <option value="1">Terça-feira</option>
        <option value="2">Quarta-feira</option>
        <option value="3">Quinta-feira</option>
        <option value="4">Sexta-feira</option>
        <option value="5">Sábado</option>
        <option value="6">Domingo</option>
      </select>
    </section>

    <section class="day-card">
      <div class="day-heading">
        <h2 id="day-title">Segunda-feira 💕</h2>
        <span id="today-badge" class="today-badge" hidden>HOJE 💗</span>
      </div>

      <div id="tasks"></div>

      <div class="progress">
        <div class="progress-text">
          <span>💗 Progresso do dia</span>
          <span id="progress-count">0 de 0 tarefas</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="actions">
        <button id="mark-all">🌸 Marcar todas</button>
        <button id="unmark-all">♡ Desmarcar todas</button>
      </div>
    </section>

    <footer>
      Feito com carinho 🌷<br>
      Descansar também faz parte da rotina. 💕
    </footer>

  </main>

  <script>

        ]
      },
      {

        tasks: [
          ["05:00–05:15", "🛁 Tomar banho"],
          ["05:15–06:10", "🥣 Café da manhã e se arrumar"],
          ["06:10–06:30", "🧘 Meditação contra a ansiedade"],
          ["06:30", "🚌 Sair para pegar o ônibus das 06:34 na Prefeitura"],
          ["07:10–12:30", "🏫 Escola"],
          ["12:30–15:00", "🏠 Chegar em casa, almoçar e descansar"],
          ["15:00–17:00", "🚶‍♀️🏋️ Caminhada até o SSPMS + academia"],
          ["17:00–20:00", "📚🍽️ Estudar e jantar"],
          ["20:00–21:00", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:00", "😴 Dormir"]
        ]
      },
      {
        day: "Quarta-feira",
        tasks: [
          ["05:00–05:15", "🛁 Tomar banho"],
          ["05:15–06:10", "🥣 Café da manhã e se arrumar"],
          ["06:10–06:30", "🧘 Meditação contra a ansiedade"],
          ["06:30", "🚌 Sair para pegar o ônibus das 06:34 na Prefeitura"],
          ["07:10–12:30", "🏫 Escola"],
          ["12:30–15:00", "🏠 Chegar em casa, almoçar e descansar"],
          ["15:00–17:00", "🚶‍♀️🏋️ Caminhada até o SSPMS + academia"],
          ["17:00–20:00", "📚🍽️ Estudar e jantar — prioridade: Matemática"],
          ["20:00–21:00", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:00", "😴 Dormir"]
        ]
      },
      {
        day: "Quinta-feira",
        tasks: [
          ["05:00–05:15", "🛁 Tomar banho"],
          ["05:15–06:10", "🥣 Café da manhã e se arrumar"],
          ["06:10–06:30", "🧘 Meditação contra a ansiedade"],
          ["06:30", "🚌 Sair para pegar o ônibus das 06:34 na Prefeitura"],
          ["07:10–13:00", "🏫 Escola — conferir o horário quando houver robótica"],

          ["20:00–21:00", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:00", "😴 Dormir"]
        ]
      },
      {
        day: "Sexta-feira",
        tasks: [
          ["05:00–05:15", "🛁 Tomar banho"],
          ["05:15–06:10", "🥣 Café da manhã e se arrumar"],
          ["06:10–06:30", "🧘 Meditação contra a ansiedade"],
          ["06:30", "🚌 Sair para pegar o ônibus das 06:34 na Prefeitura"],
          ["07:10–12:30", "🏫 Escola"],
          ["12:30–15:00", "🏠 Chegar em casa, almoçar e descansar"],
          ["15:00–17:00", "🚶‍♀️🏋️ Caminhada até o SSPMS + academia"],
          ["17:00–20:00", "📚🍽️ Estudar e jantar"],
          ["20:00–21:00", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:00", "😴 Dormir"]
        ]
      },
      {
        day: "Sábado",
        tasks: [
          ["07:00–07:15", "🛁 Tomar banho"],
          ["07:15–08:00", "🥣 Café da manhã"],
          ["08:00–09:00", "🧹 Organizar a casa"],
          ["09:00–10:00", "📚 Estudar, se necessário"],
          ["10:00–12:00", "🎨 Tempo livre"],
          ["12:00–13:00", "🍽️ Almoço"],
          ["13:00–15:00", "💗 Descanso e lazer"],

          ["17:00–18:00", "🗓️ Organizar as coisas para a semana"],
          ["18:00–18:30", "🍽️ Jantar"],
          ["18:30–20:00", "💗 Lazer e descanso"],
          ["20:00–21:30", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:30", "😴 Dormir"]
        ]
      },
      {
        day: "Domingo",
        tasks: [
          ["07:00–07:15", "🛁 Tomar banho"],
          ["07:15–08:00", "🥣 Café da manhã"],
          ["08:00–09:00", "🗓️ Organizar a semana"],
          ["09:00–11:00", "📚 Estudar e revisar conteúdos"],
          ["11:00–12:00", "💗 Tempo livre"],
          ["12:00–13:00", "🍽️ Almoço"],
          ["13:00–15:00", "🛋️ Descansar"],
          ["15:00–16:00", "🎒 Preparar mochila e uniforme"],
          ["16:00–18:00", "🌸 Tempo livre"],
          ["18:00–18:30", "🍽️ Jantar"],
          ["18:30–20:00", "📚 Revisar, se necessário"],
          ["20:00–21:00", "🌙 Desacelerar: ler mangá e beber chá"],
          ["21:00", "😴 Dormir"]
        ]
      }
    ];

    // A semana começa na segunda-feira.
    function getWeekKey(date = new Date()) {
      const d = new Date(Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ));

      const weekday = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - weekday);

      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const week = Math.ceil(
        (((d - yearStart) / 86400000) + 1) / 7
      );

      return `${d.getUTCFullYear()}-W${week}`;
    }

    const storageKey = `rotina-checkbox-${getWeekKey()}`;
    const todayIndex = (new Date().getDay() + 6) % 7;
    const daySelect = document.getElementById("day-select");
    const tasksContainer = document.getElementById("tasks");
    const dayTitle = document.getElementById("day-title");
    const todayBadge = document.getElementById("today-badge");
    const progressCount = document.getElementById("progress-count");
    const progressFill = document.getElementById("progress-fill");

    let completed = {};

    try {
      completed = JSON.parse(localStorage.getItem(storageKey) || "{}");
    } catch {
      completed = {};
    }

    function save() {
      localStorage.setItem(storageKey, JSON.stringify(completed));
    }

    function renderDay() {
      const dayIndex = Number(daySelect.value);
      const day = routine[dayIndex];

      dayTitle.textContent = `${day.day} 💕`;
      todayBadge.hidden = dayIndex !== todayIndex;
      tasksContainer.innerHTML = "";

      day.tasks.forEach((task, taskIndex) => {
        const id = `${dayIndex}-${taskIndex}`;

        const label = document.createElement("label");
        label.className = "task";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(completed[id]);

        const content = document.createElement("span");
        content.className = "task-content";

        const time = document.createElement("span");
        time.className = "task-time";
        time.textContent = task[0];

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task[1];

        content.append(time, name);
        label.append(checkbox, content);
        tasksContainer.appendChild(label);

        checkbox.addEventListener("change", () => {
          completed[id] = checkbox.checked;
          save();
          updateProgress();
        });
      });

      updateProgress();
    }

    function updateProgress() {
      const dayIndex = Number(daySelect.value);
      const total = routine[dayIndex].tasks.length;

      const done = routine[dayIndex].tasks.reduce((count, _, i) => {
        return count + (completed[`${dayIndex}-${i}`] ? 1 : 0);
      }, 0);

      progressCount.textContent = `${done} de ${total} tarefas`;
      progressFill.style.width = `${total ? (done / total) * 100 : 0}%`;
    }

    document.getElementById("mark-all").addEventListener("click", () => {
      const dayIndex = Number(daySelect.value);

      routine[dayIndex].tasks.forEach((_, i) => {
        completed[`${dayIndex}-${i}`] = true;
      });

      save();
      renderDay();
    });

    document.getElementById("unmark-all").addEventListener("click", () => {
      const dayIndex = Number(daySelect.value);

      routine[dayIndex].tasks.forEach((_, i) => {
        completed[`${dayIndex}-${i}`] = false;
      });

      save();
      renderDay();
    });

    daySelect.addEventListener("change", renderDay);

    // Abre automaticamente no dia atual.
    daySelect.value = String(todayIndex);
    renderDay();
  </script>
</body>
</html>
